[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "frontend",
    "models",
    "data",
    "scripts/diagnostics",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
